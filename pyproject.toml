[project]
name = "catalog-api"
version = "0.1.0"
description = "SecureStream OTT icerik katalogu servisi"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: temel hatalar, I: import sirasi, B: olasi buglar, UP: modern Python,
# S: bandit guvenlik kurallari (SAST'in ilk katmani).
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
# coverage.xml goreli yollarla: SonarQube raporu hangi klasorde analiz edilirse edilsin eslestirir
relative_files = true
