# SonarQube analizi (CI isi: sonarqube). Sunucu ve token CI degiskenlerinden: SONAR_HOST_URL, SONAR_TOKEN.
# Quality Gate "SecureStream" (yeni kod, son 30 gun): 0 yeni bug, 0 yeni zafiyet, %100 incelenmis
# security hotspot, kapsam >= %70. Kapi kirmiziysa is kirmizi (sonar.qualitygate.wait).
sonar.projectKey=catalog-api
sonar.projectName=catalog-api
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
