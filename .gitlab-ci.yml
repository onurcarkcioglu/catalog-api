# catalog-api guvenli pipeline. Ortak guvenlik isleri ve tum arac imaj digest'leri securestream/ci-templates'ten
# (tag ile; SS_CI_REF ayni tag olmali, YAML anchor). Imaj guncelleme: ci-templates scripts/pin-images.sh + yeni tag.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [test, scan, build, image-scan, sign, deploy, dast, report]

include:
  - project: securestream/ci-templates
    ref: &ss_ci_ref v1.1.0
    file:
      - templates/secret-scan.yml
      - templates/sast.yml
      - templates/sca.yml
      - templates/iac-scan.yml
      - templates/dockerfile-lint.yml
      - templates/sonarqube.yml
      - templates/exceptions-check.yml
      - templates/defectdojo-upload.yml
      - templates/dependency-track.yml

variables:
  SS_CI_REF: *ss_ci_ref
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  CHECKOV_HELM_VALUES: deploy/helm/catalog-api/ci/lint-values.yaml
  DD_REPORTS: >-
    gitleaks=gitleaks.json semgrep=semgrep.json trivy-fs=trivy-fs.json trivy-image=trivy-image.json
    zap=zap-report.xml hadolint=hadolint.json checkov-helm=checkov-helm.json@deploy/helm

default:
  tags: [docker]
  interruptible: true

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      files: [requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - pip install -q -r requirements-dev.txt

lint:
  stage: test
  extends: .python
  # Sadece ruff kurulur: bagimlilik cakismasi guvenlik lint'ini korlestiremez.
  before_script:
    - pip install -q "$(grep -i '^ruff==' requirements-dev.txt)"
  script:
    - ruff check .
    - ruff format --check .

unit-test:
  stage: test
  extends: .python
  script:
    - pytest -q --junitxml=report.xml --cov=app --cov-report=xml --cov-report=term
  artifacts:
    when: always
    paths: [coverage.xml]
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  script:
    - |
      mkdir -p /kaniko/.docker
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" \
        --destination "$IMAGE" \
        --registry-certificate "$CI_REGISTRY=$CI_SERVER_TLS_CA_FILE" \
        --digest-file image-digest.txt \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      echo "Imaj: $CI_REGISTRY_IMAGE@$(cat image-digest.txt)"
  artifacts:
    paths: [image-digest.txt]

image-scan:
  stage: image-scan
  needs: [build]
  extends: .ss-trivy
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - |
      # Genel CA'lar + lab CA: hem trivy-db indirilir hem lab registry'ye guvenilir.
      cat /etc/ssl/certs/ca-certificates.crt "$CI_SERVER_TLS_CA_FILE" > /tmp/ca-bundle.pem
      export SSL_CERT_FILE=/tmp/ca-bundle.pem
      IMAGE_REF="$CI_REGISTRY_IMAGE@$(cat image-digest.txt)"
      trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE_REF"
      trivy image --format json --output trivy-image.json "$IMAGE_REF"
      trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_REF"
  artifacts:
    when: always
    paths: [sbom.cdx.json, trivy-image.json]
    expire_in: 90 days

sign:
  stage: sign
  # Quality Gate kirmiziysa imza ve deploy olmaz
  needs: [build, image-scan, sonarqube]
  image:
    name: $COSIGN_IMAGE
    entrypoint: [""]
  rules:
    # Protected degiskenler yalnizca korumali dalda var: imzayi sadece main atar.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      cat /etc/ssl/certs/ca-certificates.crt "$CI_SERVER_TLS_CA_FILE" > /tmp/ca-bundle.pem
      export SSL_CERT_FILE=/tmp/ca-bundle.pem
      umask 077
      echo "$COSIGN_PRIVATE_KEY_B64" | base64 -d > /tmp/cosign.key
      IMAGE_REF="$CI_REGISTRY_IMAGE@$(cat image-digest.txt)"
      cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
      cosign sign --yes --key /tmp/cosign.key --tlog-upload=false "$IMAGE_REF"
      cosign attest --yes --key /tmp/cosign.key --tlog-upload=false --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"
      # SLSA v1 build provenance: kaynak commit, ci-templates surumu, base image ve kaniko digest'leri
      sh ci/slsa-provenance.sh > provenance.json
      cosign attest --yes --key /tmp/cosign.key --tlog-upload=false --type slsaprovenance1 --predicate provenance.json "$IMAGE_REF"
      rm -f /tmp/cosign.key
      # Dogrulamalar ayri komut: "cmd && echo" zincirinde hata set -e'yi tetiklemez, is yesil kalirdi
      cosign verify --key cosign.pub --insecure-ignore-tlog=true "$IMAGE_REF" > /dev/null
      echo "Imza dogrulandi: $IMAGE_REF"
      cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true --type cyclonedx "$IMAGE_REF" > /dev/null
      echo "SBOM attestation dogrulandi"
      cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true --type slsaprovenance1 "$IMAGE_REF" > /dev/null
      echo "SLSA provenance dogrulandi"
  artifacts:
    paths: [provenance.json]
    expire_in: 90 days

deploy:
  stage: deploy
  needs: [build, sign]
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  # Ayni anda tek deploy; Kyverno imzasiz imaji zaten reddeder.
  resource_group: lab
  environment:
    name: lab
    url: https://catalog.securestream.lab
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      umask 077
      echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig
      helm lint deploy/helm/catalog-api
      helm upgrade --install catalog-api deploy/helm/catalog-api -n catalog \
        --set image.repository="$CI_REGISTRY_IMAGE" \
        --set image.digest="$(cat image-digest.txt)" \
        --atomic --wait --timeout 5m
      helm status catalog-api -n catalog | head -6

dast:
  stage: dast
  needs: [deploy]
  image:
    name: $ZAP_IMAGE
    docker:
      user: root
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # 2 = yalnizca WARN (sari, durdurmaz). 1 = zap-rules.tsv'deki FAIL kurali tetiklendi (kirmizi).
  allow_failure:
    exit_codes: [2]
  script:
    - |
      rm -rf /zap/wrk && ln -s "$CI_PROJECT_DIR" /zap/wrk
      zap-api-scan.py -t https://catalog.securestream.lab/openapi.json -f openapi \
        -c zap-rules.tsv -r zap-report.html -J zap-report.json -x zap-report.xml
  artifacts:
    when: always
    paths: [zap-report.html, zap-report.json, zap-report.xml]
    expire_in: 30 days
