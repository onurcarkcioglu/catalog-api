# Varsayilan ret: sadece ingress controller 8080'e gelebilir; uygulamanin disariya hic cikisi yok.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "catalog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "catalog.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: 8080
          protocol: TCP
  egress: []
