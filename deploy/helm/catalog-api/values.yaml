replicaCount: 2
image:
  repository: registry.securestream.lab/securestream/catalog-api
  digest: ""        # zorunlu: pipeline sha256:... verir; etiketle render edilmez (CKV_K8S_14/43)
  # Always: digest degismez, ama her pod baslangicinda registry yetkisi yeniden dogrulanir (CKV_K8S_15).
  pullPolicy: Always
imagePullSecrets:
  - name: registry-pull
service:
  port: 80
ingress:
  enabled: true
  className: traefik
  host: catalog.securestream.lab
  clusterIssuer: securestream-lab-ca
networkPolicy:
  ingressControllerNamespace: traefik
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
